[project]
name = "contentsignal"
version = "0.1.0"
description = "Does product text add predictive lift over tabular features for purchase propensity?"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Pinned per trd.md §2. pandas is deliberately absent from this list: it arrives
# transitively via mlflow and is permitted only in notebooks and report generation.
dependencies = [
  "polars>=1.0",           # in-memory frames
  "duckdb>=1.0",           # out-of-core aggregation
  "pyarrow>=16",           # parquet IO
  "numpy>=1.26",
  "lightgbm>=4.3",
  "scikit-learn>=1.5",     # logreg, isotonic, TruncatedSVD
  "torch>=2.3",            # MPS backend
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  "mlflow>=2.14",
  "pydantic>=2.7",         # config validation
  "pyyaml>=6.0",
  "typer>=0.12",           # CLI
  "scipy>=1.13",           # spearmanr, alias sampling support
  "kaggle>=1.6",           # the fresh-clone download path only; ingest reads data/ if present
]

[project.optional-dependencies]
bench = ["onnxruntime>=1.18", "optimum>=1.20"]   # trd.md §12 only
dev = [
  "pytest>=8.0",
  "pytest-xdist",
  "ruff",
  "mypy",
  "types-pyyaml",
]

[project.scripts]
contentsignal = "contentsignal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contentsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# prd.md and trd.md contain illustrative Python snippets. They are specification prose,
# not code under maintenance, and ruff reformatting them would create spurious diffs on
# documents that are meant to be stable references.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["contentsignal"]
mypy_path = "src"
strict = true
# The scientific stack ships incomplete or absent stubs; we type our own code strictly
# and stop at the boundary rather than littering ignores at every call site.
[[tool.mypy.overrides]]
module = [
  "duckdb.*",
  "kaggle.*",
  "lightgbm.*",
  "mlflow.*",
  "scipy.*",
  "sentence_transformers.*",
  "sklearn.*",
  "transformers.*",
]
ignore_missing_imports = true
